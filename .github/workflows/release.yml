name: Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon

      - name: Prepare Release APK Asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/StefanGainey.apk

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StefanGainey-APK
          path: dist/StefanGainey.apk

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StefanGainey.apk
          tag_name: ${{ github.ref_name }}
          name: Stefan Gainey App ${{ github.ref_name }}
          body: |
            ## Stefan Gainey App
            Direct Android app embed for:
            - **YouTube**: https://youtube.com/@stefangaineygamingofficial
            - **Twitch**: https://twitch.tv/stefangainey

            ### Installation:
            Download and install `StefanGainey.apk` on your Android device.
          draft: false
          prerelease: false
